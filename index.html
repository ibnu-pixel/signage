<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Signage LayarKita</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background-color: #f4f6f9; }
    .container { max-width: 850px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    h2 { margin-top: 0; color: #333; }
    form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .full-width { grid-column: span 2; }
    input, button { padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
    button { cursor: pointer; border: none; color: white; }
    .btn-submit { background-color: #28a745; }
    .btn-cancel { background-color: #6c757d; display: none; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #dee2e6; padding: 10px; text-align: left; font-size: 14px; }
    th { background-color: #007bff; color: white; }
    tr:nth-child(even) { background-color: #f8f9fa; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Data Signage LayarKita</h2>

    <form id="crudForm">
      <input type="hidden" id="rowId">
      <input type="text" id="lokasi" placeholder="Lokasi (cth: Lobby Utama)" required>
      <input type="text" id="model" placeholder="Model Signage" required>
      <input type="text" id="sn" placeholder="Serial Number (SN)" required>
      <input type="date" id="tglInstall" required>
      
      <div class="full-width">
        <button type="button" id="btnSubmit" class="btn-submit" onclick="saveData()">Tambah Data</button>
        <button type="button" id="btnCancel" class="btn-cancel" onclick="resetForm()">Batal</button>
      </div>
    </form>

    <table>
      <thead>
        <tr>
          <th>Lokasi</th>
          <th>Model</th>
          <th>SN</th>
          <th>Tgl Install</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="5" style="text-align:center;">Memuat data...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    // MASUKKAN URL WEB APP GOOGLE SCRIPT ANDA DI SINI
    const WEB_APP_URL = "PASTE_URL_WEB_APP_DI_SINI";

    window.onload = loadData;

    // Fungsi membaca data menggunakan Script Tag (Bypass CORS)
    function loadData() {
      // Hapus script JSONP lama jika ada
      const oldScript = document.getElementById('jsonpScript');
      if (oldScript) oldScript.remove();

      const script = document.createElement('script');
      script.id = 'jsonpScript';
      script.src = `${WEB_APP_URL}?callback=renderTable&_=` + new Date().getTime();
      
      script.onerror = function() {
        document.getElementById('tableBody').innerHTML = 
          '<tr><td colspan="5" style="text-align:center; color:red;">Gagal mengambil data dari Google Sheet. Periksa URL Web App dan ID Sheet.</td></tr>';
      };
      
      document.body.appendChild(script);
    }

    // Callback function yang dipanggil otomatis saat script JSONP selesai dimuat
    function renderTable(data) {
      let html = '';
      if (!data || data.length === 0) {
        html = '<tr><td colspan="5" style="text-align:center;">Belum ada data.</td></tr>';
      } else {
        data.forEach(row => {
          let tgl = row[4] ? row[4].toString().split('T')[0] : '';
          html += `<tr>
            <td>${row[1] || ''}</td>
            <td>${row[2] || ''}</td>
            <td>${row[3] || ''}</td>
            <td>${tgl}</td>
            <td>
              <button style="background:#007bff; padding:5px 10px; border-radius:3px;" onclick="editData('${row[0]}', '${row[1]}', '${row[2]}', '${row[3]}', '${tgl}')">Edit</button>
              <button style="background:#dc3545; padding:5px 10px; border-radius:3px;" onclick="deleteData('${row[0]}')">Hapus</button>
            </td>
          </tr>`;
        });
      }
      document.getElementById('tableBody').innerHTML = html;
    }

    function saveData() {
      const id = document.getElementById('rowId').value;
      const payload = {
        action: id ? "update" : "create",
        id: id,
        lokasi: document.getElementById('lokasi').value,
        model: document.getElementById('model').value,
        sn: document.getElementById('sn').value,
        tglInstall: document.getElementById('tglInstall').value
      };

      document.getElementById('btnSubmit').innerText = 'Menyimpan...';

      fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(res => res.text())
      .then(text => JSON.parse(text))
      .then(res => {
        alert(res.message);
        resetForm();
        loadData();
      })
      .catch(err => {
        alert("Gagal menyimpan data.");
        resetForm();
      });
    }

    function editData(id, lokasi, model, sn, tglInstall) {
      document.getElementById('rowId').value = id;
      document.getElementById('lokasi').value = lokasi;
      document.getElementById('model').value = model;
      document.getElementById('sn').value = sn;
      document.getElementById('tglInstall').value = tglInstall;
      document.getElementById('btnSubmit').innerText = 'Perbarui Data';
      document.getElementById('btnCancel').style.display = 'inline-block';
    }

    function deleteData(id) {
      if (confirm('Hapus data ini?')) {
        fetch(WEB_APP_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "delete", id: id })
        })
        .then(res => res.text())
        .then(text => JSON.parse(text))
        .then(res => {
          alert(res.message);
          loadData();
        });
      }
    }

    function resetForm() {
      document.getElementById('rowId').value = '';
      document.getElementById('lokasi').value = '';
      document.getElementById('model').value = '';
      document.getElementById('sn').value = '';
      document.getElementById('tglInstall').value = '';
      document.getElementById('btnSubmit').innerText = 'Tambah Data';
      document.getElementById('btnCancel').style.display = 'none';
    }
  </script>
</body>
</html>
